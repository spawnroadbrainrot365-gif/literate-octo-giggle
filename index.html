<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚀 Workflow Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
      min-height: 100vh;
    }
    h1 {
      text-align: center;
      color: #58a6ff;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .controls {
      text-align: center;
      margin-bottom: 30px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 28px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #238636;
      color: white;
      transition: 0.2s;
      font-weight: bold;
    }
    button:hover { background: #2ea043; transform: translateY(-1px); }
    button:disabled { background: #484f58; cursor: not-allowed; transform: none; }
    .refresh { background: #1f6feb; }
    .refresh:hover { background: #388bfd; }
    .cancel { background: #da3633; padding: 6px 14px; font-size: 13px; }
    .cancel:hover { background: #f85149; }
    .delete { background: #6e7681; padding: 6px 14px; font-size: 13px; }
    .delete:hover { background: #8b949e; }
    
    table {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      border-collapse: collapse;
      background: #161b22;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 14px 16px;
      text-align: right;
      border-bottom: 1px solid #30363d;
    }
    th {
      background: #21262d;
      color: #58a6ff;
      font-size: 14px;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: #1c2128; }
    
    .status {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
    }
    .queued      { background: #9e6a03; color: #fff; }
    .in_progress { background: #1f6feb; color: #fff; }
    .completed   { background: #238636; color: #fff; }
    .failure     { background: #da3633; color: #fff; }
    .ready       { background: #238636; color: #fff; }
    
    .creds {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      background: #0d1117;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #30363d;
    }
    .creds div { margin: 3px 0; }
    .creds .label { color: #8b949e; }
    .creds .value { color: #58a6ff; }
    
    .empty {
      text-align: center;
      color: #8b949e;
      padding: 60px 20px;
      font-size: 16px;
    }
    
    @media (max-width: 768px) {
      th, td { padding: 10px 8px; font-size: 13px; }
      .creds { font-size: 11px; }
    }
  </style>
</head>
<body>

  <h1>🚀 بوابة تشغيل الأجهزة</h1>

  <div class="controls">
    <button id="runBtn">▶ تشغيل الأجهزة</button>
    <button id="refreshBtn" class="refresh">🔄 تحديث</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>الحالة</th>
        <th>بيانات الاتصال</th>
        <th>إجراءات</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    const runBtn = document.getElementById('runBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const rows = document.getElementById('rows');

    // تشغيل
    runBtn.onclick = async () => {
      if (!confirm('تشغيل الأجهزة؟')) return;
      runBtn.disabled = true;
      runBtn.textContent = '⏳ جارٍ الإرسال...';
      try {
        const res = await fetch('/api/dispatch', { method: 'POST' });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        setTimeout(loadRuns, 3000);
      } catch (e) {
        alert('❌ ' + e.message);
      }
      runBtn.disabled = false;
      runBtn.textContent = '▶ تشغيل الأجهزة';
    };

    refreshBtn.onclick = loadRuns;

    // تحميل النتائج
    async function loadRuns() {
      try {
        const res = await fetch('/api/runs');
        const data = await res.json();

        if (!data.length) {
          rows.innerHTML = `<tr><td colspan="4" class="empty">لا توجد تشغيلات بعد — اضغط "تشغيل الأجهزة"</td></tr>`;
          return;
        }

        rows.innerHTML = data.map(r => {
          const status = r.conclusion === 'success' ? 'ready' : (r.status || 'queued');
          const statusText = r.conclusion ? `${r.status} / ${r.conclusion}` : (r.status || 'queued');
          
          return `
            <tr>
              <td>${r.run_id || r.id}</td>
              <td><span class="status ${status}">${statusText}</span></td>
              <td>
                ${r.ip ? `
                  <div class="creds">
                    <div><span class="label">🌐 IP:</span> <span class="value">${r.ip}</span></div>
                    <div><span class="label">👤 User:</span> <span class="value">${r.username || '-'}</span></div>
                    <div><span class="label">🔑 Pass:</span> <span class="value">${r.password || '-'}</span></div>
                  </div>
                ` : '<span style="color:#8b949e;">⏳ في انتظار البيانات...</span>'}
              </td>
              <td>
                ${r.run_id ? `<button class="cancel" onclick="cancelRun('${r.run_id}')">إلغاء</button>` : ''}
                <button class="delete" onclick="deleteRun(${r.id})">🗑</button>
              </td>
            </tr>
          `;
        }).join('');
      } catch (e) {
        console.error(e);
      }
    }

    async function cancelRun(runId) {
      if (!confirm('إلغاء هذا التشغيل؟')) return;
      await fetch(`/api/runs/${runId}/cancel`, { method: 'POST' });
      loadRuns();
    }

    async function deleteRun(id) {
      if (!confirm('حذف من الذاكرة؟')) return;
      await fetch(`/api/runs/${id}`, { method: 'DELETE' });
      loadRuns();
    }

    // تحديث تلقائي كل 5 ثواني
    setInterval(loadRuns, 5000);
    loadRuns();
  </script>

</body>
</html>
